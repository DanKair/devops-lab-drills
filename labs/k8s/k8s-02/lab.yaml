id: k8s-02
title: Deployments, Services and rolling updates
track: k8s
order: 13
minutes: 50
breakfix: false
scenario: The web app needs three replicas behind a stable address, and new versions must roll out with zero downtime and a way back.
steps:
- text: Write the Deployment and a NodePort Service.
  code: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
      labels: { app: web }
    spec:
      replicas: 3
      selector:
        matchLabels: { app: web }
      template:
        metadata:
          labels: { app: web }
        spec:
          containers:
            - name: nginx
              image: nginx:1.26-alpine
              ports:
                - containerPort: 80
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: web
    spec:
      type: NodePort
      selector: { app: web }
      ports:
        - port: 80
          targetPort: 80
          nodePort: 30080
  lang: web.yaml
- text: Apply and test from `control` (a different machine).
  code: |
    kubectl apply -f web.yaml
    kubectl get deploy,rs,pods,svc
    curl -sI http://192.168.56.11:30080 | head -1   # from control
  lang: node1 / control
- text: 'Self-healing: delete one pod and watch a replacement appear. Press Ctrl+C to stop watching.'
  code: |
    kubectl delete pod $(kubectl get pods -l app=web -o name | head -1)
    kubectl get pods -l app=web -w
  lang: node1
- text: Scale, roll out a new image, and roll back.
  code: |
    kubectl scale deployment web --replicas=5
    kubectl set image deployment/web nginx=nginx:1.27-alpine
    kubectl rollout status deployment/web
    kubectl rollout history deployment/web
    kubectl rollout undo deployment/web
  lang: node1
- text: 'See how the Service finds its pods: through labels. List the endpoints.'
  code: |
    kubectl get endpointslices -l kubernetes.io/service-name=web
  lang: node1
verify:
- run: curl -s http://192.168.56.11:30080 | grep -o "Welcome to nginx"
  expect: '`Welcome to nginx`'
- run: kubectl get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}'
  expect: '`nginx:1.26-alpine` after the undo.'
hints:
- 'Remember the chain: Deployment → ReplicaSet → Pods. A rollout creates a new ReplicaSet, and `undo` scales the old one back up.'
solution:
- text: To make rollouts truly zero-downtime, the pods need a readinessProbe. Kubernetes only sends traffic to pods that report ready. That is the next lab.
