id: k8s-fix-01
title: 'Break-fix: three pods, three failures'
track: k8s
order: 15
minutes: 40
breakfix: true
scenario: 'The on-call channel says: "api is down, worker keeps crashing, and the new report job never starts." Each of the three has a different root cause. Use `get`, `describe` and `logs`, and do not guess.'
steps:
- text: Run `lab start k8s-fix-01`. It applies these manifests to namespace `lab` (shown here for reference; you fix them with `kubectl edit` or by editing your own copy and re-applying).
  code: |
    apiVersion: v1
    kind: ConfigMap
    metadata: { name: worker-conf }
    data:
      worker.conf: "queue=jobs"
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: api }
    spec:
      replicas: 1
      selector: { matchLabels: { app: api } }
      template:
        metadata: { labels: { app: api } }
        spec:
          containers:
            - name: api
              image: python:3.12-slimm
              command: ["python", "-m", "http.server", "8000"]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: worker }
    spec:
      replicas: 1
      selector: { matchLabels: { app: worker } }
      template:
        metadata: { labels: { app: worker } }
        spec:
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "echo starting && cat /config/worker.conf && sleep 3600"]
              volumeMounts:
                - { name: conf, mountPath: /etc/worker }
          volumes:
            - name: conf
              configMap: { name: worker-conf }
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: report }
    spec:
      replicas: 1
      selector: { matchLabels: { app: report } }
      template:
        metadata: { labels: { app: report } }
        spec:
          containers:
            - name: report
              image: busybox:1.36
              command: ["sleep", "3600"]
              resources:
                requests: { memory: 64Gi }
  lang: broken.yaml
- text: 'Run `kubectl get pods`. Write down the STATUS of each: you should see three different ones.'
- text: 'Investigate each pod. Use the right tool for each status:'
  code: |
    kubectl describe pod -l app=api      # Events
    kubectl logs deploy/worker --previous  # output of the crashed run
    kubectl describe pod -l app=report   # Events: why not scheduled?
    kubectl get events --sort-by=.lastTimestamp | tail -20
  lang: node1
- text: Fix all three in `broken.yaml`, apply, and confirm everything is Running.
verify:
- run: kubectl get pods
  expect: api, worker and report all `1/1 Running`; worker RESTARTS stops increasing.
- run: kubectl logs deploy/worker
  expect: '`starting` then `queue=jobs`'
hints:
- '`ImagePullBackOff` / `ErrImagePull`: the Events say the image was not found. Check the tag spelling.'
- '`CrashLoopBackOff`: the container starts and exits. `--previous` shows the logs of the run that died.'
- '`Pending` with "Insufficient memory": a request is a reservation the scheduler must satisfy, and your node does not have 64 GiB.'
solution:
- text: 'Fixes: `python:3.12-slim` (typo `slimm`); the worker reads `/config/worker.conf` but the volume is mounted at `/etc/worker`, so change either the path or the mountPath; lower the report request to something like `64Mi`.'
