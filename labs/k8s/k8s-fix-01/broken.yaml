apiVersion: v1
kind: ConfigMap
metadata: { name: worker-conf }
data:
  worker.conf: "queue=jobs"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: python:3.12-slimm
          command: ["python", "-m", "http.server", "8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo starting && cat /config/worker.conf && sleep 3600"]
          volumeMounts:
            - { name: conf, mountPath: /etc/worker }
      volumes:
        - name: conf
          configMap: { name: worker-conf }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: report }
spec:
  replicas: 1
  selector: { matchLabels: { app: report } }
  template:
    metadata: { labels: { app: report } }
    spec:
      containers:
        - name: report
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { memory: 64Gi }
