[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "labdrills"
version = "0.1.0"
description = "TMC-style CLI for DevOps Lab Drills: start, check and track hands-on DevOps labs on your own homelab"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "Markdown>=3.6"]

[project.scripts]
lab = "labctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["labctl"]

# Ship the lab content inside the wheel so `pipx install` works without the repo.
[tool.hatch.build.targets.wheel.force-include]
"labs" = "labctl/labs"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["_site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S101 assert, S602/S603/S607 subprocess with shell, S310 urlopen: intended in a lab checker.
ignore = ["S101", "S602", "S603", "S607", "S310", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
