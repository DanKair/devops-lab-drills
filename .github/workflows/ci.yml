name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests and lab schema checks
        run: pytest -q
      - name: Shellcheck lab scripts
        run: shellcheck -s bash labs/*/*/*.sh
      - name: Site builds
        run: python scripts/build_site.py
